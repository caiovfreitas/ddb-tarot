name: Gerar HTML unico para teste
on:
  push:
    paths:
      - '.github/workflows/gerar-html-unico.yml'
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: true
      - name: Criar versao autonoma
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          root=Path('.')
          html=(root/'index.html').read_text(encoding='utf-8')
          css=(root/'css/style.css').read_text(encoding='utf-8')
          oracle=(root/'js/oracle-data.js').read_text(encoding='utf-8')
          js=(root/'js/script.js').read_text(encoding='utf-8')
          images={}
          for n in range(22):
              path=root/f'assets/cartas/{n:02d}.gif'
              if not path.is_file():
                  raise RuntimeError(f'Carta ausente: {path}')
              images[n]= 'data:image/gif;base64,'+base64.b64encode(path.read_bytes()).decode('ascii')
          def inline_image(match):
              card=int(match.group(1))
              return "'" + images[card] + "'"
          js,n=re.subn(r"'assets/cartas/(\d{2})\.gif'", inline_image, js)
          if n!=22:
              raise RuntimeError(f'Esperadas 22 imagens no JavaScript; encontradas {n}')
          html,n=re.subn(r'<link\s+rel="stylesheet"\s+href="css/style.css[^"]*"\s*/?>',
                         lambda _: '<style>\n'+css+'\n</style>',html,count=1)
          if n!=1: raise RuntimeError('Link de CSS nao encontrado')
          html,n=re.subn(r'<script\s+src="js/oracle-data.js"\s*></script>\s*<script\s+src="js/script.js"\s*></script>',
                         lambda _: '<script>\n'+oracle+'\n'+js+'\n</script>',html,count=1)
          if n!=1: raise RuntimeError('Scripts externos nao encontrados')
          output=root/'standalone/index.html'
          output.parent.mkdir(parents=True,exist_ok=True)
          output.write_text(html,encoding='utf-8')
          print('HTML unico criado:', output, 'bytes:', output.stat().st_size)
          PY
      - name: Publicar arquivo de teste na dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add standalone/index.html
          git diff --cached --quiet || (git commit -m "build: gerar HTML unico para testes locais" && git push origin HEAD:dev)
