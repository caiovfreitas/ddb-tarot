name: Organizar arquivos do Tarot
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/organizar-tarot.yml'
permissions:
  contents: write
jobs:
  organizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Separar HTML, CSS, JavaScript e imagens
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          root=Path('.')
          original=(root/'index.html').read_text(encoding='utf-8')
          style=re.search(r'(?s)<style>\s*(.*?)\s*</style>', original)
          script=re.search(r'(?s)<script>\s*(.*?)\s*</script>', original)
          if not style or not script:
              raise RuntimeError('Estrutura inesperada; nenhum arquivo alterado')
          images={}
          def extract(m):
              num=int(m.group(1))
              images[num]=base64.b64decode(m.group(2), validate=True)
              return f"{num}: 'assets/cartas/{num:02d}.gif'"
          js=re.sub(r"(\d+):\s*'data:image/gif;base64,([^']+)'", extract, script.group(1))
          if set(images)!=set(range(22)):
              raise RuntimeError(f'Esperadas 22 cartas, encontradas {sorted(images)}')
          html=original[:style.start()]+'<link rel="stylesheet" href="css/style.css" />'+original[style.end():]
          html=re.sub(r'(?s)<script>\s*.*?\s*</script>', '<script src="js/script.js"></script>', html, count=1)
          (root/'css').mkdir(exist_ok=True)
          (root/'js').mkdir(exist_ok=True)
          (root/'assets/cartas').mkdir(parents=True,exist_ok=True)
          (root/'index.html').write_text(html,encoding='utf-8')
          (root/'css/style.css').write_text(style.group(1)+'\n',encoding='utf-8')
          (root/'js/script.js').write_text(js+'\n',encoding='utf-8')
          for num,blob in images.items():
              (root/f'assets/cartas/{num:02d}.gif').write_bytes(blob)
          (root/'README.md').write_text('# ddb-tarot\n\nPágina interativa dos Arcanos Maiores.\n\n- `index.html`: estrutura da página\n- `css/style.css`: estilos\n- `js/script.js`: comportamento\n- `assets/cartas/`: 22 imagens das cartas\n',encoding='utf-8')
          print(f'Separados HTML, CSS, JS e {len(images)} imagens.')
          PY
      - name: Confirmar JavaScript válido
        run: node --check js/script.js
      - name: Publicar organização na main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css js assets/cartas README.md
          git commit -m "refactor: separar HTML, CSS, JavaScript e cartas" || exit 0
          git push origin HEAD:main
